[package]
name = "m1-cli"
version = "0.6.2"
edition = "2021"
# pk-cli-auth (cli-common v0.20.0) needs 1.89.
rust-version = "1.89"
description = "Read your M1 (m1.com) investment accounts, holdings, activity, and tax documents from the command line. Keychain-secured, agent-friendly. Unofficial — not affiliated with M1 Holdings."
license = "MIT"
repository = "https://github.com/piekstra/m1-cli"
homepage = "https://github.com/piekstra/m1-cli"
readme = "README.md"
keywords = ["m1", "investing", "brokerage", "portfolio", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "m1f"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
# `m1f mcp`: the MCP profile's tools over the same commands (DESIGN.md §1.9).
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0", features = ["stdio", "http"] }
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }

[dev-dependencies]
# The MCP profile's conformance checks, for the tests only.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0", features = ["test-util"] }
# Captures built by hand and the kept browser profile moved to a temp dir, for
# the tests only, so the binary is built without them and no test reaches the
# owner's real profile.
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
